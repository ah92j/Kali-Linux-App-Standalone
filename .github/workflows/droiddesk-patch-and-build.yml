      - name: Validate custom Applications menu Python and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n app/android/app/src/main/assets/droiddesk/kali/desktop-experience.sh
          bash app/android/app/src/main/assets/droiddesk/kali/desktop-experience.sh --self-test
          bash -n app/android/app/src/main/assets/droiddesk/kali/ensure-applications-menu.sh
          bash app/android/app/src/main/assets/droiddesk/kali/ensure-applications-menu.sh --self-test
          python3 -m py_compile app/android/app/src/main/assets/droiddesk/kali/applications-menu.py

      - name: Validate Kali APT setup script syntax and configuration
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="app/android/app/src/main/assets/droiddesk/kali/setup-kali-default.sh"
          bash -n "$SCRIPT"
          bash "$SCRIPT" --self-test
          ! grep -Fq 'KALI_CDN' "$SCRIPT"
          ! grep -Fq 'KALI_REDIRECTOR' "$SCRIPT"
          ! grep -Fq 'http://' "$SCRIPT"
          ! grep -Fq 'stty' "$SCRIPT"
          test "$(grep -Fc 'run_apt_transaction() {' "$SCRIPT")" -eq 1
          test "$(grep -Fc 'Package installation and verification completed.' "$SCRIPT")" -eq 1

          EXPERIENCE="app/android/app/src/main/assets/droiddesk/kali/desktop-experience.sh"
          bash -n "$EXPERIENCE"
          bash "$EXPERIENCE" --self-test
          MENU_HELPER="app/android/app/src/main/assets/droiddesk/kali/ensure-applications-menu.sh"
          bash -n "$MENU_HELPER"
          bash "$MENU_HELPER" --self-test

      - name: Validate non-interactive Kali installer shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt'
          ).read_text()
          start = source.index('fun installKaliProotDesktop(')
          end = source.index('private fun configureKaliDns(', start)
          method = source[start:end]
          assert '"/bin/bash", "-lc"' not in method
          assert method.count('"/bin/bash", "-c"') == 3
          print('Kali setup uses non-login, non-interactive Bash for preflight, APT and verification.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android CMake and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "cmake;3.22.1" "build-tools;35.0.0"
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > app/android/local.properties

      - name: Configure permanent release signing
        shell: bash
        env:
          DROIDDESK_KEYSTORE_BASE64: ${{ secrets.DROIDDESK_KEYSTORE_BASE64 }}
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DROIDDESK_KEYSTORE_BASE64:?Missing DROIDDESK_KEYSTORE_BASE64 secret}"
          : "${DROIDDESK_KEYSTORE_PASSWORD:?Missing DROIDDESK_KEYSTORE_PASSWORD secret}"
          : "${DROIDDESK_KEY_ALIAS:?Missing DROIDDESK_KEY_ALIAS secret}"
          : "${DROIDDESK_KEY_PASSWORD:?Missing DROIDDESK_KEY_PASSWORD secret}"

          KEYSTORE_PATH="$RUNNER_TEMP/droiddesk-release.jks"

          printf '%s' "$DROIDDESK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$DROIDDESK_KEYSTORE_PASSWORD" \
            -alias "$DROIDDESK_KEY_ALIAS" >/dev/null

          echo "DROIDDESK_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Permanent release keystore loaded and alias validated."

      - name: Generate Gradle wrapper
        working-directory: app/android
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: gradle wrapper --gradle-version 8.14 --distribution-type bin --no-validate-url

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Run in-app update selection tests
        working-directory: app
        run: flutter test test/services/update_service_test.dart

      - name: Run rootfs archive path safety tests
        working-directory: app/android
        shell: bash
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build ARM64 release APK
        working-directory: app
        shell: bash
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify permanent APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner was not found in Android build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"

          ACTUAL_SHA256="$(sed -n 's/.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          EXPECTED_SHA256="e8ba3273fa8e3ca05db4f13b2c58b9c539808c84c71721a293c6dbad4fe80656"

          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signing certificate mismatch."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   ${ACTUAL_SHA256:-not found}"
            exit 1
          fi

          echo "APK certificate matches the permanent DroidDesk release key."

      - name: Prepare versioned release APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/droiddesk-release"
          mkdir -p "$RELEASE_DIR"
          RELEASE_APK="$RELEASE_DIR/Kali-Linux-1.4.38-arm64.apk"
          cp "app/build/app/outputs/flutter-apk/app-release.apk" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"
          cat "$RELEASE_APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kali-Linux-1.4.38-arm64
          path: |
            app/build/droiddesk-release/Kali-Linux-1.4.38-arm64.apk
            app/build/droiddesk-release/Kali-Linux-1.4.38-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v1.4.38+60"
          APK="app/build/droiddesk-release/Kali-Linux-1.4.38-arm64.apk"
          CHECKSUM="$APK.sha256"
          TITLE="Kali Linux 1.4.38 (Debian, App Store and Firefox repairs; build +60)"
          NOTES="Standalone repair build based on the exact 1.4.38+55 runtime snapshot, previously published as 1.4.38+59. Adds non-destructive recovery of the missing ARM64 libandroid-support.so bootstrap library, stricter Debian runtime readiness checks, serialized Kali App Store install/remove operations with dpkg recovery and lock timeouts, restored Firefox desktop shortcut creation, and standalone in-app update routing. Android versionCode 60 (versionName 1.4.38) allows an in-place update over builds +55, +56, +58, and +59 without uninstalling. Preserves app data, installed rootfs, package database and XFCE preferences. Uses the permanent release signing key. GitHub Actions validates the source, runs Flutter and Android unit tests, builds ARM64 APK and verifies the signing certificate. Actual device behavior requires phone testing after installation."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing the APK with this verified build."
            gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --clobber
            gh release edit "$RELEASE_TAG" --title "$TITLE" --prerelease --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK" "$CHECKSUM" \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes "$NOTES"
          fi
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,assets
