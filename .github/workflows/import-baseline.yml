name: Import verified 1.4.38+59 source snapshot

on:
  push:
    paths:
      - ".github/workflows/import-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the standalone destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out exactly the verified 1.4.38+59 source snapshot
        uses: actions/checkout@v4
        with:
          repository: ah92j/Kali-Linux-App
          ref: 4a0c7e18903f573bc4364f0b45b68e9dcbf7cf09
          path: source-snapshot
          fetch-depth: 1

      - name: Import the single source snapshot without old release workflows
        shell: bash
        run: |
          set -euo pipefail
          snapshot_tmp="$(mktemp -d "$RUNNER_TEMP/kali-source.XXXXXX")"
          cp -a source-snapshot/. "$snapshot_tmp/"
          rm -rf source-snapshot
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/import-baseline.yml' \
            --exclude='/.github/workflows/droiddesk-patch-and-build.yml' \
            --exclude='/.github/workflows/publish-*.yml' \
            "$snapshot_tmp/" ./
          rm -rf "$snapshot_tmp"

          # The GitHub Actions token cannot write workflow files in this import run.
          # The permanent build workflow is installed separately after this source sync.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified Kali Linux 1.4.38+59 source snapshot"
          git push origin HEAD:main
