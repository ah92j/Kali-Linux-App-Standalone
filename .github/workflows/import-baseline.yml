name: Inspect verified ARM64 bootstrap archive

on:
  push:
    paths:
      - ".github/workflows/import-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact 1.4.38+59 source snapshot
        uses: actions/checkout@v4
        with:
          repository: ah92j/Kali-Linux-App
          ref: 4a0c7e18903f573bc4364f0b45b68e9dcbf7cf09
          path: source-snapshot
          fetch-depth: 1
      - name: Inspect bootstrap archive paths and metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "=== matching library entries ==="
          unzip -Z1 source-snapshot/app/assets/bootstrap-aarch64.zip | grep -Ei '(^|/)(libandroid-support|libandroid-shmem|libc\+\+_shared)\.so' || true
          echo "=== bash and library directories ==="
          unzip -Z1 source-snapshot/app/assets/bootstrap-aarch64.zip | grep -E '(^|/)(bin/bash|lib/|lib64/)' | head -n 80
          echo "=== archive integrity ==="
          unzip -tq source-snapshot/app/assets/bootstrap-aarch64.zip
